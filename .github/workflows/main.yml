name: Process PDF

on:
  repository_dispatch:
    types: [process_pdf]

jobs:
  extract-and-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate payload
        run: |
          if [ -z "${{ github.event.client_payload.file_url }}" ]; then
            echo "ERROR: file_url is missing from client_payload"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.webhook_url }}" ]; then
            echo "ERROR: webhook_url is missing from client_payload"
            exit 1
          fi

      - name: Download PDF from Google Drive
        run: |
          curl -L \
            --max-filesize 52428800 \
            -o /tmp/document.pdf \
            "${{ github.event.client_payload.file_url }}"

          # Verify it's actually a PDF
          file /tmp/document.pdf | grep -q "PDF" || (echo "Not a valid PDF" && exit 1)
          echo "PDF size: $(du -sh /tmp/document.pdf | cut -f1)"

      - name: Extract text via PDF service
        id: extract
        run: |
          RESPONSE=$(curl -s -X POST \
            --max-time 120 \
            -F "file=@/tmp/document.pdf;type=application/pdf" \
            "${{ secrets.PDF_SERVICE_URL }}/process-pdf")

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','error'))")

          if [ "$STATUS" != "success" ]; then
            echo "PDF service error: $RESPONSE"
            exit 1
          fi

          # Concatenate all chunk texts into one document
          FULL_TEXT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          chunks = d.get('text_chunks', [])
          print('\n\n'.join(c['text'] for c in chunks))
          ")

          echo "Extracted $(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_chunks',0))") chunks"

          # Write to file to avoid env size limits
          echo "$FULL_TEXT" > /tmp/extracted_text.txt

      - name: POST text back to n8n webhook
        run: |
          FULL_TEXT=$(cat /tmp/extracted_text.txt)

          # Build JSON payload safely using python
          python3 -c "
          import json, sys

          payload = {
            'text': open('/tmp/extracted_text.txt').read(),
            'file_id': '${{ github.event.client_payload.file_id }}',
            'file_name': '${{ github.event.client_payload.file_name }}'
          }

          with open('/tmp/payload.json', 'w') as f:
            json.dump(payload, f)
          "

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d @/tmp/payload.json \
            "${{ github.event.client_payload.webhook_url }}")

          echo "n8n webhook responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Webhook call failed with status $HTTP_CODE"
            exit 1
          fi
